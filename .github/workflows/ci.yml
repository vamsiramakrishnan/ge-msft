name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  build-test:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: lint
        run: bun run lint
      - name: test
        run: bun run test
      - name: build
        run: bun run build
      # ADR-0008 §4 drift gate: the committed language manifest must equal the emitter output.
      - name: generated skills are current
        run: bun run skills:check

  skill-python:
    name: skill parsers · parity · eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: skill/requirements.txt
      - run: pip install -r skill/requirements.txt
      # The zips are gitignored build artifacts (skill/**/*.zip) that test_tooling.py's
      # HTTP-hardening/upload tests read from disk — build them fresh, same as
      # scripts/update-ge-widget-skills.sh's own "Rebuild skill zips" step does locally.
      - name: build skill zips
        working-directory: skill
        run: |
          ./build_zip.sh m365-command-planner
          ./build_zip.sh m365-surface-commander
          ./build_zip.sh m365-release-operator
      - name: skill archive source parity
        run: python3 skill/validate_skill_bundles.py --check-zip
      # Catches the same drift `bun run skills:check` catches locally, BEFORE it reaches a
      # workstation running `bun run ge:skills` against a stale checkout.
      - name: resource indexes are not stale
        run: python3 skill/generate_resource_index.py --check
      - name: parse_commands self-test
        run: python3 skill/m365-surface-commander/scripts/parse_commands.py --self-test
      - name: surface_cli self-test
        run: python3 skill/m365-surface-commander/scripts/surface_cli.py --self-test
      - name: planner + corpus parity
        working-directory: skill
        run: |
          python3 parity_test.py
          python3 parity_corpus_test.py
      - name: standalone manifest and archive checks
        run: python3 skill/test_manifest_contract.py
      - name: tooling unit tests
        working-directory: skill
        run: python3 test_tooling.py
      - name: deterministic eval gate (recall / false-positives)
        working-directory: skill
        run: python3 eval/eval_harness.py

  browser-contracts:
    name: IndexedDB cross-pane contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser-contracts
      - name: workflow panel screenshots
        run: |
          bun run dev > /tmp/ge-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:17100/ > /dev/null && break; sleep 1; done
          node scripts/pane-shots.mjs --surface word --panel actions --demo 0 --query 'office-workflows=1&office-lab=1' --expand 'Contract review' --fill 1 --out /tmp/office-workflow-shots
          node scripts/pane-shots.mjs --surface word --panel actions --demo 0 --query 'office-workflows=1&office-lab=1' --expand 'Refresh managed text' --fill 1 --out /tmp/office-workflow-shots
          node scripts/pane-shots.mjs --surface outlook --panel actions --demo 0 --query 'office-workflows=1&office-lab=1' --expand 'Response package' --fill 1 --out /tmp/office-workflow-shots
          node scripts/pane-shots.mjs --surface excel --panel actions --demo 0 --query 'office-workflows=1&office-lab=1' --expand 'Native Office certification' --out /tmp/office-workflow-shots
          node scripts/pane-shots.mjs --surface powerpoint --panel actions --demo 0 --query 'office-workflows=1&office-lab=1' --scroll interrupted --out /tmp/office-workflow-shots
          node scripts/pane-shots.mjs --surface excel --panel actions --demo 0 --query 'office-workflows=1&office-lab=1&office-report=1' --expand 'Native Office certification' --scroll report --out /tmp/office-workflow-shots
          node scripts/pane-shots.mjs --surface powerpoint --panel actions --demo 0 --query 'office-workflows=1&office-lab=1' --scroll interrupted --check 1 --out /tmp/office-workflow-shots-checked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-workflow-shots
          path: |
            /tmp/office-workflow-shots
            /tmp/office-workflow-shots-checked
