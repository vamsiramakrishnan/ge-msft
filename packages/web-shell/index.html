<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Gemini Enterprise for Microsoft 365</title>
    <script>
      // The unified M365 manifest opens the Teams personal tab at `/?host=teams`.
      // Keep `/` useful for humans while forwarding host launches to the real app shell.
      const host = new URLSearchParams(window.location.search).get('host');
      if (host) {
        window.location.replace(`/taskpane.html${window.location.search}${window.location.hash}`);
      }
    </script>
    <style>
      :root {
        color: #1d1d1f;
        background: #f4f3ef;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid #d8d6cf;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(38 43 40 / 8%);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 32px;
        color: #176b4d;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        content: '';
      }

      h1 {
        max-width: 14ch;
        margin: 0;
        font-size: clamp(36px, 8vw, 64px);
        font-weight: 620;
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      p {
        max-width: 48ch;
        margin: 28px 0 0;
        color: #5b5a55;
        font-size: 17px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Hosting is ready</div>
      <h1>Gemini Enterprise for Microsoft 365</h1>
      <p>
        This site serves the secure web experience used by the Microsoft 365 add-in. Open Gemini
        Enterprise from Word, Excel, PowerPoint, Outlook, OneNote, or Teams to get started.
      </p>
    </main>
  </body>
</html>
