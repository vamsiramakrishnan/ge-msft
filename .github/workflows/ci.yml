name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm run test
      - name: build
        run: npm run build
      # ADR-0008 §4 drift gate: the committed language manifest must equal the emitter output.
      - name: language-manifest is not stale
        run: |
          npm run emit:language
          git diff --exit-code skill/m365-surface-commander/scripts/m365-cli-1.0.json \
            || { echo "::error::m365-cli-1.0.json is stale — run 'npm run emit:language' and commit."; exit 1; }

  skill-python:
    name: skill parsers · parity · eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: parse_commands self-test
        run: python3 skill/m365-surface-commander/scripts/parse_commands.py --self-test
      - name: surface_cli self-test
        run: python3 skill/m365-surface-commander/scripts/surface_cli.py --self-test
      - name: planner + corpus parity
        working-directory: skill
        run: |
          python3 parity_test.py
          python3 parity_corpus_test.py
      - name: tooling unit tests
        working-directory: skill
        run: python3 test_tooling.py
      - name: deterministic eval gate (recall / false-positives)
        working-directory: skill
        run: python3 eval/eval_harness.py
