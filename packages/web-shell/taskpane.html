  <head>

    <title>%GE_BRAND_NAME%</title>

         the host document's own voice (quoted source prose, redlines). CSS fallbacks keep the pane

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="%GE_BRAND_FONT_STYLESHEET%" rel="stylesheet" />
    <!-- Office.js (host-injected at runtime in a real host; harmless when absent in a browser tab). -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/taskpane/main.tsx"></script>
